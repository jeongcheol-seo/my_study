<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>간단한 검색 실습</title>
    <script>
        const 브랜드 =['애플', '삼성', 'LG', '구글', 'MS', '소니', '샤오미', '화웨이', '레노보', '델'];

        const 검색기능 = (event) => {
            console.log("인자", event); // 항상 뭐가 들었나 중간중간 콘솔 찍어보면 이해가 쉽습니다.
        }
    </script>
</head>
<body>
    <input type="text" placeholder="검색어를 입력하세요" oninput="검색기능(event)" />
    <div id="검색결과보여주는곳"></div>
</body>
</html>
